<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TiAmo Massage - Payout System</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:#0d0d0d;
      color:#fff;
      min-height:100vh;
    }

    .hidden{
      display:none;
    }

    /* LANDING */

    .landing{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      gap:20px;
      background:
      linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.82)),
      url('https://images.unsplash.com/photo-1515377905703-c4788e51af15?q=80&w=1600&auto=format&fit=crop') center/cover;
    }

    .landing h1{
      font-size:52px;
      color:#d4af37;
      letter-spacing:2px;
    }

    .landing p{
      color:#ccc;
    }

    .main-btn{
      width:320px;
      padding:18px;
      border:none;
      border-radius:12px;
      font-size:18px;
      font-weight:600;
      cursor:pointer;
      background:#d4af37;
      color:#000;
      transition:0.3s;
    }

    .main-btn:hover{
      background:#f1cb52;
      transform:translateY(-2px);
    }

    /* HEADER */

    .topbar{
      width:100%;
      padding:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#111;
      border-bottom:1px solid rgba(255,255,255,0.08);
      position:sticky;
      top:0;
      z-index:100;
    }

    .topbar h2{
      color:#d4af37;
      font-size:22px;
    }

    .small-btn{
      padding:12px 18px;
      border:none;
      border-radius:10px;
      background:#d4af37;
      color:#000;
      font-weight:600;
      cursor:pointer;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:20px;
    }

    .actions{
      display:flex;
      gap:12px;
      margin-bottom:20px;
      flex-wrap:wrap;
      justify-content:center;
    }

    /* PAYSLIP */

    .payslip{
      background:#fff;
      color:#000;
      border-radius:16px;
      padding:22px;
      margin-bottom:25px;
      box-shadow:0 10px 35px rgba(0,0,0,0.4);
      width:1123px;
      max-width:100%;
      margin-left:auto;
      margin-right:auto;
    }

    .company-title{
      text-align:center;
      margin-bottom:18px;
    }

    .company-title h1{
      font-size:28px;
      color:#111;
      letter-spacing:2px;
    }

    .company-title p{
      color:#666;
      font-size:13px;
    }

    .section-title{
      margin:18px 0 10px;
      font-size:16px;
      border-left:4px solid #d4af37;
      padding-left:10px;
      color:#111;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:12px;
      margin-bottom:12px;
    }

    .field{
      display:flex;
      flex-direction:column;
    }

    .field label{
      font-size:12px;
      font-weight:600;
      margin-bottom:5px;
      color:#444;
    }

    .field input,
    .field textarea{
      padding:10px;
      border-radius:8px;
      border:1px solid #ccc;
      font-family:'Poppins',sans-serif;
      font-size:12px;
    }

    .field textarea{
      min-height:70px;
      resize:vertical;
    }

    /* EARNINGS */

    .earnings-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }

    .day-box{
      border:1px solid #ddd;
      border-radius:12px;
      padding:10px;
      background:#fafafa;
    }

    .day-box h4{
      font-size:13px;
      margin-bottom:8px;
      color:#111;
    }

    /* PENALTIES */

    .penalty-item{
      border:1px solid #ddd;
      border-radius:12px;
      padding:12px;
      margin-bottom:10px;
      background:#fafafa;
    }

    /* TOTALS */

    .totals{
      margin-top:18px;
      background:#111;
      color:#fff;
      border-radius:14px;
      padding:18px;
    }

    .totals-row{
      display:flex;
      justify-content:space-between;
      padding:8px 0;
      border-bottom:1px solid rgba(255,255,255,0.08);
      font-size:14px;
    }

    .totals-row:last-child{
      border-bottom:none;
      font-size:20px;
      font-weight:700;
      color:#d4af37;
    }

    /* DOWNLOAD */

    .download-btn{
      width:100%;
      margin-top:18px;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#d4af37;
      color:#000;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    /* HISTORY */

    .history-card{
      background:#fff;
      color:#000;
      padding:20px;
      border-radius:14px;
      margin-bottom:18px;
    }

    .history-card h3{
      margin-bottom:8px;
    }

    /* PRINT */

    @media print{

      body{
        background:#fff;
      }

      .download-btn,
      .small-btn,
      .topbar,
      .actions{
        display:none !important;
      }

      .payslip{
        width:100%;
        box-shadow:none;
        border-radius:0;
        margin:0;
        padding:12mm;
        page-break-inside:avoid;
      }
    }

    /* MOBILE */

    @media(max-width:900px){

      .earnings-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .landing h1{
        font-size:38px;
      }

      .container{
        padding:15px;
      }
    }

  </style>
</head>

<body>

  <!-- LANDING PAGE -->

  <section class="landing" id="landingPage">

    <h1>TiAmo Massage</h1>

    <p>Therapist Payout Management System</p>

    <button class="main-btn" onclick="openPayouts('weekday')">
      Weekday Payouts
    </button>

    <button class="main-btn" onclick="openPayouts('weekend')">
      Weekend Payouts
    </button>

    <button class="main-btn" onclick="openHistory()">
      Previous Payouts
    </button>

  </section>

  <!-- PAYOUT PAGE -->

  <section class="hidden" id="payoutPage">

    <div class="topbar">

      <h2 id="payoutHeading">
        TiAmo Massage - Payouts
      </h2>

      <button class="small-btn" onclick="goHome()">
        Back Home
      </button>

    </div>

    <div class="container">

      <!-- TOP BUTTON -->

      <div class="actions">

        <button class="small-btn" onclick="addPayslip()">
          + Add New Payslip
        </button>

      </div>

      <div id="payslipContainer"></div>

      <!-- BOTTOM BUTTON -->

      <div class="actions">

        <button
          class="small-btn"
          id="bottomAddBtn"
          onclick="addPayslip()"
        >
          + Add Another Payslip
        </button>

      </div>

    </div>

  </section>

  <!-- HISTORY PAGE -->

  <section class="hidden" id="historyPage">

    <div class="topbar">

      <h2>Previous Payouts</h2>

      <button class="small-btn" onclick="goHome()">
        Back Home
      </button>

    </div>

    <div class="container">

      <div id="historyContainer"></div>

    </div>

  </section>

<script>

  const payouts =
  JSON.parse(localStorage.getItem("tiamo_payouts")) || [];

  let payoutType = 'weekday';

  function goHome(){

    landingPage.classList.remove('hidden');

    payoutPage.classList.add('hidden');

    historyPage.classList.add('hidden');
  }

  function openPayouts(type){

    payoutType = type;

    landingPage.classList.add('hidden');

    payoutPage.classList.remove('hidden');

    historyPage.classList.add('hidden');

    document.getElementById('payslipContainer')
    .innerHTML = '';

    document.getElementById('payoutHeading')
    .innerText =
      payoutType === 'weekday'
      ? 'TiAmo Massage - Weekday Payouts'
      : 'TiAmo Massage - Weekend Payouts';

    document.getElementById('bottomAddBtn')
    .innerText =
      payoutType === 'weekday'
      ? '+ Add Another Weekday Payslip'
      : '+ Add Another Weekend Payslip';

    addPayslip();
  }

  function openHistory(){

    landingPage.classList.add('hidden');

    payoutPage.classList.add('hidden');

    historyPage.classList.remove('hidden');

    loadHistory();
  }

  function formatCurrency(value){

    return "R " + Number(value || 0).toFixed(2);
  }

  function createDayField(day){

    return `
    <div class="day-box">

      <h4>${day}</h4>

      <div class="field">

        <label>Date</label>

        <input type="date">

      </div>

      <div class="field">

        <label>Amount Earned</label>

        <input
        type="number"
        class="earning-input"
        value="0">

      </div>

    </div>
    `;
  }

  function attachCalculationListeners(slip){

    const inputs =
    slip.querySelectorAll(
      '.earning-input, .deduction-input'
    );

    inputs.forEach(input => {

      input.addEventListener('input', () => {

        calculateTotals(slip);

      });

    });
  }

  function calculateTotals(slip){

    let earnings = 0;

    slip.querySelectorAll('.earning-input')
    .forEach(input => {

      earnings += Number(input.value || 0);

    });

    const ads =
    Number(slip.querySelector('.ads').value || 0);

    const levy =
    Number(slip.querySelector('.levy').value || 0);

    let penalties = 0;

    slip.querySelectorAll('.penalty')
    .forEach(input => {

      penalties += Number(input.value || 0);

    });

    const grandTotal =
    earnings - ads - levy - penalties;

    slip.querySelector('.before-total')
    .innerText = formatCurrency(earnings);

    slip.querySelector('.grand-total')
    .innerText = formatCurrency(grandTotal);
  }

  function addPayslip(){

    const id = Date.now();

    const slip = document.createElement('div');

    slip.className = 'payslip';

    slip.id = `payslip-${id}`;

    slip.innerHTML = `

    <div class="company-title">

      <h1>TiAmo Massage</h1>

      <p>
        ${
          payoutType === 'weekday'
          ? 'Weekday Therapist Payout Slip'
          : 'Weekend Therapist Payout Slip'
        }
      </p>

    </div>

    <div class="grid">

      <div class="field">

        <label>Current Date</label>

        <input
        type="date"
        class="current-date">

      </div>

      <div class="field">

        <label>Therapist Name</label>

        <input
        type="text"
        class="therapist-name"
        placeholder="Enter therapist name">

      </div>

    </div>

    <h3 class="section-title">

      ${
        payoutType === 'weekday'
        ? 'Weekday Earnings'
        : 'Weekend Earnings'
      }

    </h3>

    <div class="earnings-grid">

      ${
        payoutType === 'weekday'
        ? `
          ${createDayField('Monday')}
          ${createDayField('Tuesday')}
          ${createDayField('Wednesday')}
          ${createDayField('Thursday')}
        `
        : `
          ${createDayField('Friday')}
          ${createDayField('Saturday')}
          ${createDayField('Sunday')}
        `
      }

    </div>

    <h3 class="section-title">
      Deductions
    </h3>

    <div class="grid">

      <div class="field">

        <label>Ads Amount (ZAR)</label>

        <input
        type="number"
        class="ads deduction-input"
        value="0">

      </div>

      <div class="field">

        <label>Levy Amount (ZAR)</label>

        <input
        type="number"
        class="levy deduction-input"
        value="0">

      </div>

    </div>

    <!-- PENALTIES -->

    <div class="penalties-wrapper">

      <div class="penalty-item">

        <div class="grid">

          <div class="field">

            <label>Penalty Date</label>

            <input
            type="date"
            class="penalty-date">

          </div>

          <div class="field">

            <label>Penalty Reason</label>

            <input
            type="text"
            class="penalty-reason"
            placeholder="Reason">

          </div>

          <div class="field">

            <label>Penalty Amount</label>

            <input
            type="number"
            class="penalty deduction-input"
            value="0">

          </div>

        </div>

      </div>

    </div>

    <button
    type="button"
    class="small-btn add-penalty-btn"
    style="margin-top:10px;">

    + Add Another Penalty

    </button>

    <!-- TOTALS -->

    <div class="totals">

      <div class="totals-row">

        <span>Total Before Deductions</span>

        <span class="before-total">
          R 0.00
        </span>

      </div>

      <div class="totals-row">

        <span>Grand Total</span>

        <span class="grand-total">
          R 0.00
        </span>

      </div>

    </div>

    <!-- NOTES -->

    <h3 class="section-title">
      Notes
    </h3>

    <div class="field">

      <textarea
      class="notes"
      placeholder="Add notes here..."></textarea>

    </div>

    <!-- DOWNLOAD -->

    <button class="download-btn">

      Download Payslip PNG

    </button>
    `;

    document.getElementById('payslipContainer')
    .appendChild(slip);

    slip.querySelector('.current-date')
    .valueAsDate = new Date();

    attachCalculationListeners(slip);

    calculateTotals(slip);

    // ADD PENALTY

    slip.querySelector('.add-penalty-btn')
    .addEventListener('click', () => {

      const wrapper =
      slip.querySelector('.penalties-wrapper');

      const div =
      document.createElement('div');

      div.className = 'penalty-item';

      div.innerHTML = `

      <div class="grid">

        <div class="field">

          <label>Penalty Date</label>

          <input
          type="date"
          class="penalty-date">

        </div>

        <div class="field">

          <label>Penalty Reason</label>

          <input
          type="text"
          class="penalty-reason"
          placeholder="Reason">

        </div>

        <div class="field">

          <label>Penalty Amount</label>

          <input
          type="number"
          class="penalty deduction-input"
          value="0">

        </div>

      </div>
      `;

      wrapper.appendChild(div);

      attachCalculationListeners(slip);

    });

    // DOWNLOAD

    slip.querySelector('.download-btn')
    .addEventListener('click', () => {

      downloadPayslip(slip);

    });
  }

  async function downloadPayslip(slip){

    saveToHistory(slip);

    const therapist =
    slip.querySelector('.therapist-name').value
    || "Therapist";

    const canvas = await html2canvas(slip,{

      scale:1.5,
      useCORS:true,
      backgroundColor:"#ffffff"

    });

    const link =
    document.createElement('a');

    link.download =
    `${therapist}-Payslip.png`;

    link.href = canvas.toDataURL("image/png");

    link.click();
  }

  function saveToHistory(slip){

    const payout = {

      therapist:
      slip.querySelector('.therapist-name').value,

      date:
      slip.querySelector('.current-date').value,

      total:
      slip.querySelector('.grand-total').innerText,

      type:
      payoutType
    };

    payouts.push(payout);

    localStorage.setItem(
      "tiamo_payouts",
      JSON.stringify(payouts)
    );
  }

  function loadHistory(){

    const historyContainer =
    document.getElementById('historyContainer');

    historyContainer.innerHTML = '';

    if(payouts.length === 0){

      historyContainer.innerHTML = `

      <div class="history-card">

        <h3>No Previous Payouts</h3>

        <p>No payout history available yet.</p>

      </div>
      `;

      return;
    }

    payouts.slice().reverse().forEach(item => {

      const card =
      document.createElement('div');

      card.className = 'history-card';

      card.innerHTML = `

      <h3>${item.therapist}</h3>

      <p>
      <strong>Date:</strong>
      ${item.date}
      </p>

      <p>
      <strong>Payout Type:</strong>
      ${
        item.type === 'weekday'
        ? 'Weekday'
        : 'Weekend'
      }
      </p>

      <p>
      <strong>Grand Total:</strong>
      ${item.total}
      </p>
      `;

      historyContainer.appendChild(card);

    });
  }

</script>

</body>
</html>
